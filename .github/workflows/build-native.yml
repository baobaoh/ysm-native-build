name: build-native

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # gcc-12 的 libstdc++ 缺 <format>（GCC 13 才有），<mdspan> 要 GCC 15。
      # 用 ubuntu-toolchain-r/test 保持 jammy 的 glibc 2.35（与目标服一致）。
      - name: Add gcc PPA
        run: |
          sudo apt-get install -y software-properties-common || true
          if ! sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then
            echo "::error title=ppa-failed::add-apt-repository ppa:ubuntu-toolchain-r/test 失败"
            exit 1
          fi
          sudo apt-get update || true
          echo "::notice::PPA added"

      - name: Install gcc-15 and build tools
        run: |
          set -x
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              ninja-build gcc-15 g++-15 nasm yasm build-essential \
              pkg-config autoconf automake libtool; then
            echo "::error title=apt-install-failed::apt-get install gcc-15 等失败（可能 PPA 里没有该版本）"
            apt-cache policy gcc-15 g++-15 | head -n 20
            exit 1
          fi

      - name: Make gcc-15 default
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-15 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-15 100
          gcc --version | head -n1
          g++ --version | head -n1
          ldd --version | head -n1

      - name: Install conan + cmake
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "conan==2.33.0" "cmake>=3.29"
          which conan cmake ninja
          conan --version
          cmake --version | head -n1

      - name: Verify C++23 headers
        run: |
          fail=0
          for h in format mdspan print expected; do
            printf '#include <%s>\nint main(){return 0;}\n' "$h" > /tmp/t.cc
            if g++ -std=c++23 /tmp/t.cc -o /tmp/t 2>/tmp/err.txt; then
              echo "OK   <$h>"
            else
              echo "FAIL <$h>"
              head -n 3 /tmp/err.txt
              echo "::error title=missing-header::C++23 头文件 <$h> 不可用"
              fail=1
            fi
          done
          exit $fail

      - name: Fetch source
        run: |
          curl -fL -o src.tar.gz https://codeload.github.com/YesSteveModel/YesSteveModel-Native/tar.gz/refs/heads/dev
          mkdir -p work && tar -xzf src.tar.gz -C work --strip-components=1
          chmod +x work/bootstrap.sh
          ls work

      # bootstrap.sh 内部 export CONAN_HOME=<repo>/conan/cache，只对当前 shell 生效，
      # 所以 setup 与 build 必须同一步执行。
      - name: Conan setup + Build native
        working-directory: work
        env:
          CC: gcc
          CXX: g++
          LDFLAGS: "-static-libstdc++ -static-libgcc"
        run: |
          set -o pipefail
          conan profile detect --force
          conan profile show
          bash -x ./bootstrap.sh setup
          export CONAN_HOME="$PWD/conan/cache"
          conan list "*" 2>&1 | head -n 40 || true
          bash -x ./bootstrap.sh build native 2>&1 | tee build-trace.log

      - name: Report build errors
        if: failure()
        run: |
          mkdir -p logs
          cp work/build-trace.log logs/ 2>/dev/null || true
          tail -n 30 work/build-trace.log > logs/tail.txt 2>/dev/null || true
          grep -E "fatal error|CMake Error|^ERROR|error:" work/build-trace.log 2>/dev/null | head -n 10 > logs/errors.txt || true
          echo "=== errors ==="
          cat logs/errors.txt 2>/dev/null || true
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=build::$line"
          done < logs/errors.txt || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/**
          if-no-files-found: warn

      - name: Locate library
        if: always()
        run: |
          find . -name "libysm*.so*" -type f -exec ls -l {} \;
          ls -la work/build 2>/dev/null | head -n 20 || true

      - name: Upload libysm.so
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libysm-so
          path: work/**/libysm*.so*
          if-no-files-found: warn
