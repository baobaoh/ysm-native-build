name: build-native

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # gcc-12 的 libstdc++ 缺 <format>（GCC 13 才有），<mdspan> 要 GCC 16。
      # 用 ubuntu-toolchain-r/test 保持 jammy 的 glibc 2.35（与目标服一致）。
      - name: Add gcc PPA
        run: |
          sudo apt-get install -y software-properties-common || true
          if ! sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then
            echo "::error title=ppa-failed::add-apt-repository ppa:ubuntu-toolchain-r/test 失败"
            exit 1
          fi
          sudo apt-get update || true
          echo "::notice::PPA added"

      - name: Install gcc-16 and build tools
        run: |
          set -x
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              ninja-build gcc-16 g++-16 nasm yasm build-essential \
              pkg-config autoconf automake libtool; then
            echo "::error title=apt-install-failed::apt-get install gcc-16 等失败（可能 PPA 里没有该版本）"
            apt-cache policy gcc-16 g++-16 | head -n 20
            exit 1
          fi

      - name: Make gcc-16 default
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 200 && sudo update-alternatives --set gcc /usr/bin/gcc-16
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-16 200 && sudo update-alternatives --set g++ /usr/bin/g++-16
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-16 200 && sudo update-alternatives --set cc /usr/bin/gcc-16
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-16 200 && sudo update-alternatives --set c++ /usr/bin/g++-16
          gcc --version | head -n1
          g++ --version | head -n1
          ldd --version | head -n1

      - name: Install conan + cmake
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "conan==2.33.0" "cmake>=3.29"
          which conan cmake ninja
          conan --version
          cmake --version | head -n1

      - name: Verify C++23 headers
        run: |
          ver="$(g++ -dumpversion || echo unknown)"
          echo "g++ -dumpversion = $ver"
          g++ --version | head -n1
          fail=0
          for h in format mdspan print expected; do
            printf '#include <%s>\nint main(){return 0;}\n' "$h" > /tmp/t.cc
            if g++ -std=c++23 /tmp/t.cc -o /tmp/t 2>/tmp/err.txt; then
              echo "OK   <$h>"
            else
              echo "FAIL <$h>"
              head -n 3 /tmp/err.txt
              echo "::error title=missing-header::C++23 头文件 <$h> 不可用（编译器 g++ $ver）"
              fail=1
            fi
          done
          exit $fail

      # 固定到 ca32a15f79（2026-08-10「补充 BakedModel accessor uv 属性」）。
      # dev HEAD 的 native API 已被 checkpoint 重构，与我们 Java 端的绑定对不上
      # （Alloc 返回类型、Bake/Render 返回值、Create 签名全变了），这个提交是
      # 与 3.0-dev Java 绑定最接近的一版（30 个描述符一一对应）。
      - name: Fetch source (pinned)
        run: |
          SHA=ca32a15f795809a94973b746a1d5b46ab53d8dc5
          curl -fL -o src.tar.gz "https://codeload.github.com/YesSteveModel/YesSteveModel-Native/tar.gz/$SHA"
          mkdir -p work && tar -xzf src.tar.gz -C work --strip-components=1
          chmod +x work/bootstrap.sh
          ls work
          ls work/modules

      # 上游默认 -march=x86-64（基线），但代码里 YSM_TARGET_AVX2 标的是
      # __attribute__((target("avx2,fma"))) + always_inline：GCC 把 always_inline
      # 的内联体折进不带 target 的调用方时，会报
      # "inlining failed in call to always_inline '_mm_fmadd_ps': target specific option mismatch"，
      # 因为基线 -march=x86-64 后面出现会重置 ISA 特性。改成 v3（AVX2+FMA 基线）。
      # 目标服 CPU 是 Xeon Platinum 8124M（Cascade Lake），支持 AVX2/FMA/AVX-512。
      - name: Patch baseline ISA to x86-64-v3
        run: |
          f=work/conan/cmake/targets/linux-x64.cmake
          sed -i -E 's/-march=x86-64(-v[0-9])?\)/-march=x86-64-v3)/' "$f"
          grep -n "march" "$f"

      # Java 端 33 个 native 方法里有 6 个在这一版 native 源码中不存在：
      #   NativeHeapBuffer.nWrap(JI)Ljava/nio/ByteBuffer;
      #   OpusDecoder.nCreate()J / nInit(J,ByteBuffer)Z / nDecode(J,ByteBuffer)I
      #                / nReset(J)V / nDestroy(J)V
      # 这里用仓库自带的 YSM_JNI_ENTRY 机制补上（modules/lib 会 GLOB 编译 src/*.cc）。
      - name: Inject legacy JNI entries
        run: |
          mkdir -p work/modules/lib/src/compat
          cat > work/modules/lib/src/compat/legacy_entries.cc <<'CC_EOF'
          // Compatibility JNI entries for the ported 3.0 Java bindings.
          #include <codec/opus.h>
          #include <java/buffer.h>
          #include <java/entry.h>

          #include <cstddef>
          #include <cstdint>

          #include "log.h"

          namespace ysm::lib::compat {
          static_assert(sizeof(jlong) == sizeof(void*));

          using OpusStream = ysm::codec::OpusAudioStream;

          namespace {
          OpusStream* StreamOf(jlong ptr) noexcept {
              return reinterpret_cast<OpusStream*>(static_cast<std::uintptr_t>(ptr));
          }
          }  // namespace

          YSM_JNI_ENTRY(
              "Lcom/elfmcys/ysm/natives/buffer/NativeHeapBuffer;nWrap(JI)Ljava/nio/ByteBuffer;",
              (addr, size)) {
              YSM_ASSERT(size >= 0, absl::InvalidArgumentError("Invalid buffer size"sv));
              auto* buffer =
                  env->NewDirectByteBuffer(reinterpret_cast<void*>(addr), size);
              YSM_ASSERT(buffer != nullptr,
                         absl::InternalError("Failed to wrap native memory"sv));
              return static_cast<jobject>(buffer);
          }

          YSM_JNI_ENTRY("Lcom/elfmcys/ysm/natives/sound/OpusDecoder;nCreate()J", (),
                        jlong{0}) {
              return reinterpret_cast<jlong>(new OpusStream());
          }

          YSM_JNI_ENTRY(
              "Lcom/elfmcys/ysm/natives/sound/OpusDecoder;nInit(JLjava/nio/ByteBuffer;)Z",
              (ptr, data)) {
              YSM_ASSERT(ptr != 0, absl::InvalidArgumentError("Invalid decoder"sv));
              YSM_DECLARE_OR_RETURN(input, java::GetDirectBuffer(env, data));
              StreamOf(ptr)->Consume(input);
              return OkStatus();
          }

          YSM_JNI_ENTRY(
              "Lcom/elfmcys/ysm/natives/sound/OpusDecoder;nDecode(JLjava/nio/ByteBuffer;)I",
              (ptr, dst)) {
              YSM_ASSERT(ptr != 0, absl::InvalidArgumentError("Invalid decoder"sv));
              YSM_DECLARE_OR_RETURN(output, java::GetDirectBuffer(env, dst));
              return static_cast<jint>(StreamOf(ptr)->Decode(output));
          }

          YSM_JNI_ENTRY("Lcom/elfmcys/ysm/natives/sound/OpusDecoder;nReset(J)V", (ptr)) {
              if (ptr != 0) {
                  StreamOf(ptr)->Reset();
              }
              return OkStatus();
          }

          YSM_JNI_ENTRY("Lcom/elfmcys/ysm/natives/sound/OpusDecoder;nDestroy(J)V", (ptr)) {
              delete StreamOf(ptr);
              return OkStatus();
          }
          }  // namespace ysm::lib::compat
          CC_EOF
          head -n 6 work/modules/lib/src/compat/legacy_entries.cc
          grep -c YSM_JNI_ENTRY work/modules/lib/src/compat/legacy_entries.cc

      # bootstrap.sh 内部 export CONAN_HOME=<repo>/conan/cache，只对当前 shell 生效，
      # 所以 setup 与 build 必须同一步执行。
      # upstream dav1d 用 meson 构建，meson.build:102-103 全局加了 -D_GNU_SOURCE；
      # 但 ysm 自己那份 CMakeLists（third-party/dav1d/patches/dav1d.patch）漏了它，
      # 于是 src/lib.c:100 的 dlsym(RTLD_DEFAULT, ...) 在 glibc 上报
      # "'RTLD_DEFAULT' undeclared"（RTLD_DEFAULT 只在 _GNU_SOURCE 下可见）。
      # 用环境变量 CFLAGS 补上，不改 patch 文件（避免破坏 hunk 行数）。
      - name: Conan setup + Build native
        working-directory: work
        env:
          CC: gcc
          CXX: g++
          CFLAGS: "-D_GNU_SOURCE"
          CPPFLAGS: "-D_GNU_SOURCE"
          LDFLAGS: "-static-libstdc++ -static-libgcc"
        run: |
          set -o pipefail
          conan profile detect --force
          conan profile show
          bash -x ./bootstrap.sh setup
          export CONAN_HOME="$PWD/conan/cache"
          conan list "*" 2>&1 | head -n 40 || true
          bash -x ./bootstrap.sh build native 2>&1 | tee build-trace.log

      - name: Report build errors
        if: failure()
        run: |
          mkdir -p logs
          cp work/build-trace.log logs/ 2>/dev/null || true
          tail -n 30 work/build-trace.log > logs/tail.txt 2>/dev/null || true
          grep -E "fatal error|CMake Error|^ERROR|error:" work/build-trace.log 2>/dev/null | sort -u | head -n 6 > logs/errors.txt || true
          echo "=== errors ==="
          cat logs/errors.txt 2>/dev/null || true
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=build::$(echo "$line" | cut -c1-600)"
          done < logs/errors.txt || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/**
          if-no-files-found: warn

      - name: Locate library
        if: always()
        run: |
          find . -name "libysm*.so*" -type f -exec ls -l {} \;
          ls -la work/build 2>/dev/null | head -n 20 || true

      - name: Upload libysm.so
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libysm-so
          path: work/**/libysm*.so*
          if-no-files-found: warn
