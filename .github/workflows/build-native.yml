name: build-native

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-12 g++-12
          python3 -m pip install --upgrade pip
          python3 -m pip install "conan==2.33.0" "cmake>=3.29"
          gcc-12 --version | head -n1
          cmake --version | head -n1
          conan --version

      - name: Fetch source
        run: |
          curl -fL -o src.tar.gz https://codeload.github.com/YesSteveModel/YesSteveModel-Native/tar.gz/refs/heads/dev
          mkdir -p work && tar -xzf src.tar.gz -C work --strip-components=1
          ls work

      - name: Build native
        working-directory: work
        env:
          CC: gcc-12
          CXX: g++-12
          LDFLAGS: "-static-libstdc++ -static-libgcc"
        run: |
          ./bootstrap.sh setup
          ./bootstrap.sh build native

      - name: Locate library
        run: |
          find . -name "libysm*.so*" -type f -exec ls -l {} \;

      - name: Upload libysm.so
        uses: actions/upload-artifact@v4
        with:
          name: libysm-so
          path: work/**/libysm.so
          if-no-files-found: error
