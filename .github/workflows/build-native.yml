name: build-native

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # gcc-12 的 libstdc++ 没有 <format>（C++20），GCC 13 才有。
      # 用 ubuntu-toolchain-r/test 装 gcc-13，再用 alternatives 让 conan 的
      # profile detect 认到 gcc-13，同时保持 jammy 的 glibc 2.35（目标服一致）。
      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13 nasm yasm build-essential pkg-config autoconf automake libtool
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-13 100
          python3 -m pip install --upgrade pip
          python3 -m pip install "conan==2.33.0" "cmake>=3.29"
          echo "--- versions ---"
          which conan cmake ninja gcc g++ nasm
          conan --version
          cmake --version | head -n1
          ninja --version
          gcc --version | head -n1
          g++ --version | head -n1
          echo '#include <format>' > /tmp/fmt.cc
          echo 'int main(){ auto s = std::format("{}", 1); return s.empty(); }' >> /tmp/fmt.cc
          g++ -std=c++23 /tmp/fmt.cc -o /tmp/fmt && echo "std::format OK"

      - name: Fetch source
        run: |
          curl -fL -o src.tar.gz https://codeload.github.com/YesSteveModel/YesSteveModel-Native/tar.gz/refs/heads/dev
          mkdir -p work && tar -xzf src.tar.gz -C work --strip-components=1
          chmod +x work/bootstrap.sh
          ls work

      # bootstrap.sh 内部 export CONAN_HOME=<repo>/conan/cache，只对当前 shell 生效，
      # 所以 setup 与 build 必须同一步执行。
      - name: Conan setup + Build native
        working-directory: work
        env:
          CC: gcc
          CXX: g++
          LDFLAGS: "-static-libstdc++ -static-libgcc"
        run: |
          set -o pipefail
          conan profile detect --force
          echo "--- detected profile ---"
          conan profile show
          echo "--- bootstrap setup ---"
          bash -x ./bootstrap.sh setup
          export CONAN_HOME="$PWD/conan/cache"
          echo "--- exported recipes ---"
          conan list "*" 2>&1 | head -n 40 || true
          echo "--- bootstrap build ---"
          bash -x ./bootstrap.sh build native 2>&1 | tee build-trace.log

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p logs
          cp work/build-trace.log logs/ 2>/dev/null || true
          tail -n 40 work/build-trace.log > logs/tail.txt 2>/dev/null || true
          grep -E "fatal error|CMake Error|^ERROR|error:" work/build-trace.log 2>/dev/null | head -n 20 > logs/errors.txt || true
          echo "=== errors.txt ==="
          cat logs/errors.txt 2>/dev/null || true
          echo "=== tail.txt ==="
          cat logs/tail.txt 2>/dev/null || true
          # 把关键错误行推到 check-run annotation（公开可读）
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=build::$line"
          done < logs/errors.txt || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/**
          if-no-files-found: warn

      - name: Locate library
        if: always()
        run: |
          find . -name "libysm*.so*" -type f -exec ls -l {} \;
          ls -la work/build 2>/dev/null | head -n 30 || true

      - name: Upload libysm.so
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libysm-so
          path: work/**/libysm*.so*
          if-no-files-found: warn
